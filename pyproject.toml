[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpipeline"
version = "0.1.0"
description = "Simulation environment for building and operating realistic ML systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Primoz Ravbar" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jupyter",
    "matplotlib",
]
console = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx",          # fastapi.testclient, for tests/test_console_api.py
]

[tool.setuptools.packages.find]
include = ["simulation*", "world*", "ml_system*", "dashboard*", "console*"]

[tool.setuptools.package-data]
console = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
