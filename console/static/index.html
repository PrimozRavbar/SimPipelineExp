<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimPipeline Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ops console. Sticky top bar (clock, mission, prod model, budget), left nav, one screen at a time. Single dark look, like real on-call tooling. */
:root {
  --bg: #0C0F14; --surface: #131821; --surface-2: #1A202B; --line: #262E3B; --line-soft: #1D2430;
  --fg: #E6EBF2; --muted: #9AA5B5; --accent: #7AA7FF; --accent-strong: #3D74E0;
  --ok: #40D39C; --warn: #F2A93B; --crit: #FF7A7A; --info: #9AA5B5;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
h3 { font-size: 13px; font-weight: 600; margin: 0; }
p { margin: 0; }
.label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
.muted { color: var(--muted); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.env { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.group { display: flex; align-items: center; gap: 10px; }
.clock { font-family: var(--mono); font-size: 15px; min-width: 92px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 0 10px; min-height: 32px; cursor: pointer; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.iconbtn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.iconbtn:hover { border-color: var(--accent); }
.budget { width: 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.budget > span { display: block; height: 100%; background: var(--accent); }
.spacer { flex: 1 1 0; }

/* shell */
.shell { display: flex; flex-wrap: wrap; align-items: flex-start;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; gap: 24px; }
nav.side { flex: 1 1 200px; max-width: 100%; }
.navlist { display: flex; flex-wrap: wrap; gap: 4px; }
.navbtn { flex: 1 1 180px; display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); text-align: left; }
.navbtn:hover { color: var(--fg); background: var(--surface); }
.navbtn[aria-current="page"] { color: var(--fg); background: var(--surface-2); border-color: var(--line); }
.navbtn .count { margin-left: auto; font-family: var(--mono); font-size: 11px; background: var(--crit); color: #1A0C0C; border-radius: 9px; padding: 0 7px; font-weight: 600; }
.side .note { margin-top: 16px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; font-size: 12px; color: var(--muted); }
main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 16px; }
.row > * { min-width: 0; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.btn.primary:hover { background: #4A82EE; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 10px; border: 1px solid currentColor; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-crit { color: var(--crit); } .s-info { color: var(--info); } .s-accent { color: var(--accent); }
.bg-ok { background: var(--ok); } .bg-warn { background: var(--warn); } .bg-crit { background: var(--crit); } .bg-info { background: var(--info); }
.toast { border: 1px solid var(--accent-strong); background: #15213A; border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.tile .big { font-family: var(--mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; color: var(--muted); }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
.seriesline { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12px; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.sel td { background: var(--surface-2); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }

/* pipeline */
.lane { display: flex; flex-direction: column; gap: 10px; }
.lanerow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.node { flex: 1 1 140px; max-width: 200px; text-align: left; cursor: pointer; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.node:hover { border-color: var(--muted); }
.node[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.node .nm { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.node .tool { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.node .st { font-size: 12px; margin-top: auto; }
.arrow { align-self: center; color: var(--muted); flex: none; }
.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.field label { color: var(--fg); }
.field small { display: block; color: var(--muted); font-size: 12px; }
.field input[type=number] { width: 96px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); padding: 6px 8px; font-family: var(--mono); font-size: 13px; text-align: right; }
.switch { position: relative; width: 44px; height: 24px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--accent-strong); border-color: var(--accent-strong); }
.switch[aria-checked="true"]::after { left: 23px; background: #fff; }

/* missions & incidents */
.objective { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; margin-top: 1px; }
.check.done { background: var(--ok); border-color: var(--ok); color: #08130E; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; }
.mission { flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px; }
.alertlist { display: flex; flex-direction: column; }
.alert { display: grid; grid-template-columns: 4px 1fr; gap: 12px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line-soft); padding: 12px 8px 12px 0; cursor: pointer; }
.alert:hover, .alert[aria-pressed="true"] { background: var(--surface-2); }
.alert .stripe { border-radius: 2px; }
.alert .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.opt { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: pointer; margin-top: 8px; }
.opt:hover { border-color: var(--muted); }
.opt.right { border-color: var(--ok); }
.opt.wrong { border-color: var(--warn); }
.feedback { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
ol.runbook { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.log { display: flex; flex-direction: column; }
.logitem { display: grid; grid-template-columns: 74px 84px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; align-items: baseline; }
.logitem .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
@media (max-width: 520px) { .logitem { grid-template-columns: 64px 1fr; } .logitem .k { display: none; } .clock { min-width: 0; } }
.mockbadge { font-size: 11px; font-family: var(--mono); color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 1px 6px; letter-spacing: .04em; }
.notlive { opacity: .55; }
.field input:disabled, .switch:disabled { opacity: .45; cursor: not-allowed; }
.empty { padding: 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
.toast.err { border-color: var(--crit); background: #3A1515; }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
</style>
</head><body>

<header class="top" id="top"></header>
<div class="shell">
  <nav class="side" aria-label="Console sections">
    <div class="navlist" id="nav"></div>
    <p class="note" id="conn">Connecting to the simulation…</p>
  </nav>
  <main id="main"></main>
</div>

<script>
(function () {
  "use strict";
  // Live console: every number comes from the console API (console/server.py).
  // Nothing here imports or fakes simulation data, except the Missions screen,
  // which is labelled as mock.
  const SCREENS = ["missions", "pipeline", "models", "monitoring", "incidents"];
  const S = {
    screen: "monitoring", node: "server", alert: null, range: 600, window: 50, toast: null, toastErr: false,
    connected: false, error: null,
    st: null, rows: [], deploys: [], log: [], logSeq: 0, models: null, pipe: null, incidents: [],
    draft: {},     // edited but not applied yet
    pending: {}    // applied, waiting for the next tick boundary
  };
  try { const h = location.hash.slice(1); if (SCREENS.includes(h)) S.screen = h; } catch (e) {}

  const pct = (x, d = 1) => x == null || Number.isNaN(x) ? "–" : (x * 100).toFixed(d) + "%";
  const fmt = (n) => n == null ? "–" : Number(n).toLocaleString("en-US");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- API ----------
  // Every request times out, so one stuck request can never freeze the
  // screen (it used to wait for the browser to give up, up to minutes).
  const TIMEOUT_MS = 5000;
  async function get(path) {
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const r = await fetch(path, { cache: "no-store", signal: ctrl.signal });
      if (!r.ok) throw new Error(path + ": HTTP " + r.status);
      return await r.json();
    } catch (e) {
      throw e.name === "AbortError" ? new Error("no answer from the server within " + TIMEOUT_MS / 1000 + " s") : e;
    } finally { clearTimeout(timer); }
  }
  async function post(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
    return data;
  }

  let polling = false;
  async function poll() {
    if (polling) return; polling = true;
    try {
      const lastTick = S.rows.length ? S.rows[S.rows.length - 1].tick : 0;
      // One request for everything (fewer round trips through proxies).
      const snap = await get("/api/snapshot?since=" + lastTick + "&events_since=" + S.logSeq);
      const st = snap.state, m = snap.metrics, ev = { events: snap.events },
        inc = { incidents: snap.incidents }, models = snap.models, pipe = snap.pipeline;
      S.faults = snap.faults;
      if (S.st && st.tick < S.st.tick) { S.rows = []; S.log = []; S.logSeq = 0; } // server restarted
      // Pending settings stay on screen until the server reports them
      // (or until no action is queued any more, i.e. it was rejected).
      for (const k of Object.keys(S.pending)) {
        if (pipe.settings[k] === S.pending[k] || st.pending_actions === 0) delete S.pending[k];
      }
      S.st = st; S.pipe = pipe; S.deploys = m.deploys; S.incidents = inc.incidents; S.models = models;
      for (const r of m.rows) if (!S.rows.length || r.tick > S.rows[S.rows.length - 1].tick) S.rows.push(r);
      for (const e of ev.events) { S.log.push(e); S.logSeq = Math.max(S.logSeq, e.seq); }
      S.connected = true; S.error = null; S.lastOk = Date.now();
      if (S.toast && Date.now() - (S.toastAt || 0) > 10000) S.toast = null;
    } catch (e) {
      S.connected = false; S.error = String(e.message || e);
    } finally { polling = false; }
    render(false);
  }

  // ---------- derived metrics ----------
  // Rolling CTR = clicks / shown over the trailing `w` ticks.
  function rollingSeries(w) {
    const out = []; let sh = 0, cl = 0; const R = S.rows;
    for (let i = 0; i < R.length; i++) {
      sh += R[i].shown; cl += R[i].clicks;
      if (i >= w) { sh -= R[i - w].shown; cl -= R[i - w].clicks; }
      out.push({ tick: R[i].tick, v: sh ? cl / sh : null });
    }
    return out;
  }
  function ctrBetween(a, b) {
    let sh = 0, cl = 0;
    for (const r of S.rows) if (r.tick >= a && r.tick <= b) { sh += r.shown; cl += r.clicks; }
    return sh ? cl / sh : null;
  }
  function derived() {
    const st = S.st, t = st ? st.tick : 0;
    const series = rollingSeries(S.window);
    const ctr = series.length ? series[series.length - 1].v : null;
    const lastDeploy = S.deploys.length ? S.deploys[S.deploys.length - 1] : { tick: 0, version: 0 };
    const sinceDeploy = lastDeploy.tick > 0 ? ctrBetween(lastDeploy.tick + 1, t) : null;
    const beforeDeploy = lastDeploy.tick > 0 ? ctrBetween(Math.max(1, lastDeploy.tick - 200), lastDeploy.tick) : null;
    const last = S.rows.length ? S.rows[S.rows.length - 1] : null;
    const lat = S.rows.slice(-S.window).map((r) => r.latency_p50_ms).filter((x) => x != null).sort((a, b) => a - b);
    const latP50 = lat.length ? lat[Math.floor(lat.length / 2)] : null;
    const latP99 = lat.length ? lat[Math.min(lat.length - 1, Math.floor(lat.length * 0.99))] : null;
    const mismatch = st ? st.model_version !== st.index_version : false;
    return { t, st, series, ctr, lastDeploy, sinceDeploy, beforeDeploy, last, latP50, latP99, mismatch,
      open: S.incidents.filter((i) => i.status === "Open").length };
  }

  // ---------- icons ----------
  const I = {
    missions: '<path d="M4 21V4h11l-1 4h6v9H10l1-4H4"/>',
    pipeline: '<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8M18 8l-5 8"/>',
    models: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
    monitoring: '<path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/>',
    incidents: '<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
    play: '<path d="M8 5v14l11-7z"/>', pause: '<path d="M8 5v14M16 5v14"/>', step: '<path d="M6 5v14l9-7z"/><path d="M18 5v14"/>',
    arrow: '<path d="M4 12h14M13 6l6 6-6 6"/>', check: '<path d="M5 12l5 5 9-10"/>',
    logo: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2h11v-2M12 12v2"/>'
  };
  const icon = (n, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
  const mock = '<span class="mockbadge">MOCK</span>';
  const notLive = '<span class="mockbadge">not live yet</span>';

  // ---------- top bar & nav ----------
  function renderTop(d) {
    const st = d.st;
    if (!st) { document.getElementById("top").innerHTML = `<div class="brand">${icon("logo", 20)}<span>SimPipeline Console</span><span class="env">live</span></div><div class="muted">${S.error ? "Cannot reach the server: " + esc(S.error) : "Connecting…"}</div>`; return; }
    const tr = st.training;
    const cn = st.canary;
    const canaryTxt = cn ? `<span class="s-accent">canary v${cn.version} · ${cn.share}% until t ${fmt(cn.end_tick)}</span>` : "";
    const trainTxt = tr ? (st.waiting_for_training ? `<span class="s-warn">clock waiting for v${tr.version} training</span>` : `<span class="s-accent">training v${tr.version} · deploys t ${fmt(tr.deploy_tick)}</span>`) : "";
    document.getElementById("top").innerHTML = `
      <div class="brand">${icon("logo", 20)}<span>SimPipeline Console</span><span class="env">live · seed ${st.seed}</span></div>
      <div class="group">
        <button class="iconbtn" data-act="play" aria-label="${st.playing ? "Pause simulation" : "Run simulation"}">${icon(st.playing ? "pause" : "play", 16)}</button>
        <button class="iconbtn" data-act="step" aria-label="Advance 10 ticks" title="Advance 10 ticks (while paused)" ${st.playing ? "disabled" : ""}>${icon("step", 16)}</button>
        <div><div class="label">Sim clock</div><div class="clock" id="clock">tick ${fmt(st.tick)}</div></div>
        <div class="seg" role="group" aria-label="Simulation speed">${st.speeds.map((x) => `<button data-act="speed" data-v="${x}" aria-pressed="${st.speed === x}" title="${x * 2} ticks per second">${x}×</button>`).join("")}</div>
      </div>
      <div><div class="label">Mission ${mock}</div><div class="muted">Free play</div></div>
      <div><div class="label">Production model</div><div class="mono" id="prod">v${st.model_version} <span class="${d.mismatch ? "s-warn" : "s-ok"}">${d.mismatch ? "· index v" + st.index_version : "· index matches"}</span></div></div>
      <div>${trainTxt} ${canaryTxt}</div>
      <div class="spacer"></div>
      <div><div class="label">Compute budget</div><div class="group"><div class="budget" role="meter" aria-valuemin="0" aria-valuemax="${st.budget.total}" aria-valuenow="${st.budget.used}" aria-label="Compute credits used"><span style="width:${st.budget.used / st.budget.total * 100}%"></span></div><span class="mono muted">${st.budget.used}/${st.budget.total}</span></div></div>`;
  }

  function renderNav(d) {
    const labels = { missions: "Missions", pipeline: "Pipeline", models: "Models", monitoring: "Monitoring", incidents: "Incidents" };
    document.getElementById("nav").innerHTML = SCREENS.map((s) => `
      <button class="navbtn" data-act="go" data-v="${s}" ${S.screen === s ? 'aria-current="page"' : ""}>${icon(s)}<span>${labels[s]}</span>${s === "missions" ? mock : ""}${s === "incidents" && d.open ? `<span class="count">${d.open}</span>` : ""}</button>`).join("");
    renderConn();
  }

  // Connection note with the age of the data on screen. It has its own
  // timer, so it shows a stale screen even while a request is stuck.
  function renderConn() {
    const el = document.getElementById("conn");
    if (!el) return;
    const age = S.lastOk ? Math.round((Date.now() - S.lastOk) / 1000) : null;
    const stale = age != null && age >= 5;
    const run = S.st && S.st.run_dir ? ` (log <span class="mono">${esc(S.st.run_dir)}</span>)` : "";
    el.innerHTML = !S.lastOk
      ? `<span class="s-crit">●</span> ${S.error ? "Cannot reach the server: " + esc(S.error) : "Connecting…"}`
      : stale
        ? `<span class="s-warn">●</span> Screen not updated for ${age} s${S.error ? ": " + esc(S.error) : ""}. Retrying every second.`
        : `<span class="s-ok">●</span> Live: connected to the simulation${run}. Updated ${age} s ago. Missions are still mock.`;
  }

  function toastHtml() { return S.toast ? `<div class="toast ${S.toastErr ? "err" : ""}" role="status">${icon("check", 16)}<span>${esc(S.toast)}</span></div>` : ""; }

  // ---------- charts ----------
  function ctrChart(d, opts) {
    opts = opts || {};
    const end = opts.end != null ? opts.end : d.t, R = opts.range || S.range;
    const start = opts.start != null ? opts.start : Math.max(0, end - R), span = Math.max(1, end - start), H = 200, W = 1000, top = 0.8;
    const y = (v) => (H - Math.min(top, Math.max(0, v)) / top * H).toFixed(1);
    const pts0 = d.series.filter((p) => p.tick >= start && p.tick <= end && p.v != null);
    const step = Math.max(1, Math.ceil(pts0.length / 300));
    const pts = pts0.filter((p, i) => i % step === 0 || i === pts0.length - 1).map((p) => `${((p.tick - start) / span * W).toFixed(1)},${y(p.v)}`);
    const marks = [];
    for (const dep of S.deploys) if (dep.tick > start && dep.tick <= end) marks.push([dep.tick, `deploy v${dep.version}`, "var(--muted)"]);
    if (S.models) for (const v of S.models.versions) if (v.version > 0 && v.started_tick > start && v.started_tick <= end) marks.push([v.started_tick, `train v${v.version}`, "var(--accent)"]);
    if (S.models && S.models.training && S.models.training.started_tick > start) marks.push([S.models.training.started_tick, `train v${S.models.training.version}`, "var(--accent)"]);
    const markSvg = marks.map(([t, lab, col]) => { const x = ((t - start) / span * W).toFixed(1);
      return `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="${col}" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><text x="${x}" y="-6" fill="${col}" font-size="11" text-anchor="middle" font-family="var(--mono)">${lab}</text>`; }).join("");
    const grid = [0, 0.2, 0.4, 0.6, 0.8].map((v) => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)" vector-effect="non-scaling-stroke"/><text x="-8" y="${+y(v) + 4}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="var(--mono)">${v * 100}%</text>`).join("");
    const ref = d.st ? d.st.reference : { random_ctr: 0, oracle_ctr: 0 };
    const last = pts.length ? pts[pts.length - 1].split(",") : null;
    const series = pts.length ? `<polygon points="${pts[0].split(",")[0]},${H} ${pts.join(" ")} ${last[0]},${H}" fill="var(--accent)" fill-opacity="0.08"/>
        <polyline class="seriesline" points="${pts.join(" ")}" stroke="var(--accent)"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent)"/>` : `<text x="${W / 2}" y="${H / 2}" fill="var(--muted)" font-size="13" text-anchor="middle">No traffic yet: press play</text>`;
    return `<div class="chart"><svg viewBox="-40 -20 ${W + 48} ${H + 36}" role="img" aria-label="Rolling CTR from tick ${start} to ${end}, now ${pct(d.ctr)}">
        ${grid}
        <line x1="0" x2="${W}" y1="${y(ref.random_ctr)}" y2="${y(ref.random_ctr)}" stroke="var(--muted)" stroke-dasharray="1 4" vector-effect="non-scaling-stroke"/>
        <line x1="0" x2="${W}" y1="${y(ref.oracle_ctr)}" y2="${y(ref.oracle_ctr)}" stroke="var(--ok)" stroke-dasharray="1 4" vector-effect="non-scaling-stroke"/>
        ${markSvg}${series}
        <text x="0" y="${H + 16}" fill="var(--muted)" font-size="11" font-family="var(--mono)">tick ${fmt(start)}</text>
        <text x="${W}" y="${H + 16}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="var(--mono)">tick ${fmt(end)}</text>
      </svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Rolling CTR (${S.window} ticks)</span><span><i style="background:var(--ok)"></i>Perfect list ${pct(ref.oracle_ctr, 0)}</span><span><i style="background:var(--muted)"></i>Random list ${pct(ref.random_ctr, 0)}</span><span>Dashed: training starts and deploys</span></div></div>`;
  }

  function latencyChart(d) {
    const start = Math.max(0, d.t - S.range), span = Math.max(1, d.t - start), H = 110, W = 1000;
    const rows = S.rows.filter((r) => r.tick >= start && r.latency_p50_ms != null);
    const maxV = Math.max(10, ...rows.map((r) => r.latency_max_ms || 0));
    const scale = Math.pow(10, Math.ceil(Math.log10(maxV)));
    const topV = maxV <= scale / 2 ? scale / 2 : scale;
    const y = (v) => (H - Math.min(topV, v) / topV * H).toFixed(1);
    const step = Math.max(1, Math.ceil(rows.length / 300));
    const line = (k) => rows.filter((r, i) => i % step === 0).map((r) => `${((r.tick - start) / span * W).toFixed(1)},${y(r[k])}`).join(" ");
    const grid = [0, topV / 2, topV].map((v) => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)" vector-effect="non-scaling-stroke"/><text x="-8" y="${+y(v) + 4}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="var(--mono)">${v}</text>`).join("");
    return `<div class="chart small"><svg viewBox="-40 -10 ${W + 48} ${H + 20}" role="img" aria-label="Recommendation latency per tick in milliseconds">
      ${grid}<polyline class="seriesline" points="${line("latency_max_ms")}" stroke="var(--warn)"/><polyline class="seriesline" points="${line("latency_p50_ms")}" stroke="var(--accent)"/></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>median per tick</span><span><i style="background:var(--warn)"></i>slowest per tick</span><span>Wall-clock time of ModelServer.recommend in this Python process</span></div></div>`;
  }

  function logHtml(limit) {
    const all = S.log.slice().sort((a, b) => b.seq - a.seq).slice(0, limit);
    if (!all.length) return `<p class="empty">Nothing yet.</p>`;
    return `<div class="log">${all.map((x) => `<div class="logitem"><span class="mono muted">t ${fmt(x.tick)}</span><span class="k ${x.cls}">${esc(x.kind)}</span><span>${esc(x.text)}</span></div>`).join("")}</div>`;
  }

  // ---------- screens ----------
  function missions(d) {
    return `${toastHtml()}
      <div class="head"><div><div class="label">Missions ${mock}</div><h1>Free play</h1>
        <p>Scored missions are not built yet. Everything else in this console is live: the clock, CTR, models, canaries, pipeline settings, faults and incidents come from the running simulation.</p></div></div>
      <div class="row">
        <section class="panel" style="flex: 999 1 420px" aria-labelledby="obj-h">
          <div class="head"><h2 id="obj-h">Things to try</h2></div>
          <div class="objective"><span class="check"></span><span>Press play and watch CTR settle near the random-list line (the bootstrap model is untrained).</span></div>
          <div class="objective"><span class="check"></span><span>Retrain on Models. Serving continues; the new model deploys ${d.st ? d.st.training ? "at tick " + fmt(d.st.training.deploy_tick) : "a fixed number of ticks later" : ""}. Then turn on the ranking stage (Pipeline, Model server) and retrain again.</span></div>
          <div class="objective"><span class="check"></span><span>Ship safely: set a canary share on Pipeline, Model registry, and let the canary prove itself before it reaches everyone. Try the offline evaluation gate too.</span></div>
          <div class="objective"><span class="check"></span><span>Run a drill (Pipeline, Chaos), find it from the health tiles and the incident, and fix it with the right repair.</span></div>
          <div class="objective"><span class="check"></span><span>Turn on chaos and keep CTR up for 2,000 ticks without knowing what will break. Start the server with --world dynamic for users who drift, tire and keep arriving.</span></div>
          <div class="row" style="margin-top:12px; gap:8px">
            <button class="btn primary" data-act="go" data-v="monitoring">Open monitoring</button>
            <button class="btn" data-act="go" data-v="models">Open models</button>
          </div>
        </section>
        <section class="panel notlive" style="flex: 1 1 260px"><h2>Campaign ${mock}</h2>
          <p class="muted" style="margin-top:10px">1 · Launch, 2 · Bad deploy, 3 · Cold start. Scripted missions with objectives and scoring come later.</p></section>
      </div>`;
  }

  // Fields: [setting key or null (not simulated), label, help, mock default]
  const NODES = {
    kafka: { name: "Event bus", tool: "Kafka", lane: "online", real: "Apache Kafka", desc: "Every recommendation shown and every click is published here as an event. Everything downstream reads from it.",
      fields: [[null, "Partitions", "Not simulated", 3], [null, "Retention (ticks)", "Not simulated", 5000]] },
    flink: { name: "Stream features", tool: "Flink", lane: "online", real: "Apache Flink", desc: "Updates online user features (activity, interactions) in Redis as click, watch and rating events arrive.",
      fields: [["flink_capacity", "Capacity (events per tick)", "0 = unlimited. Below the event rate, lag builds up"], ["lag_alert", "Lag alert at (events)", "Opens an incident when Flink is this far behind Kafka"]] },
    redis: { name: "Online features", tool: "Redis", lane: "online", real: "Redis behind a Feast or Tecton feature store", desc: "Fast feature lookups at serving time. Must hold the same features the model was trained on.",
      fields: [["skew_alert_pct", "Skew alert at (%)", "Online vs offline genre preferences of recently served users"], [null, "Feature TTL (ticks)", "Not simulated", 1000]],
      toggles: [["rich_profiles", "Rich taste profiles", "Build genre profiles from clicks, how much of a movie was watched and ratings, recent activity first (off: watches only). Flink and Spark use the same definition"]] },
    server: { name: "Model server", tool: "ModelServer", lane: "online", real: "KServe, Triton or TorchServe", desc: "Embeds the user with the user tower, retrieves candidates from the ANN index and shows the top of the list.",
      fields: [["num_candidates", "Retrieved candidates", "Pulled from the ANN index per request"], ["slate_size", "Slate size", "Movies the user actually sees"], ["profile_candidates", "Profile candidates", "Extra candidates from the user's genre profile, merged with the two-tower ones (0 = off)"], ["diversity_pct", "Diversity (%)", "Re-ranker (MMR on genres): 0 = pure relevance. Some variety helps when users tire of repeats; too much hurts"], ["exploration_pct", "Exploration (%)", "Share of slate slots given to random lower-ranked movies: costs clicks now, shows more of the catalog"]],
      toggles: [["ranker", "Ranking stage", "Re-order the candidates with a learned ranker (trained at the next retrain; position-debiased)"], ["ranker_mlp", "MLP ranker", "On: small neural net with cross and recent-history features (recent watches, recently shown). Off: logistic regression on 4 features"], ["ranker_genre_features", "Per-genre taste features", "MLP also sees the taste match genre by genre (trained at the next retrain)"], ["ranker_multitask", "Multi-task ranker", "MLP also predicts how much of the movie will be watched; orders by p(click) x expected completion"], ["filter_watched", "Filter watched movies", "Drop movies the user already watched before showing the slate"]] },
    ann: { name: "ANN index", tool: "HNSW", lane: "online", real: "FAISS, ScaNN or a vector database", desc: "Holds one embedding per movie, produced by the item tower. It must come from the same model version as the user tower, or user and movie vectors stop being comparable.",
      fields: [[null, "M (links per node)", "Not adjustable yet", 16], [null, "efSearch", "Not adjustable yet", 64]], toggles: [["rebuild_index", "Rebuild index on deploy", "Re-embed all movies with the new item tower. Off: the new user tower is served against the old index."]] },
    lake: { name: "Data lake", tool: "DataLake", lane: "offline", real: "S3 with Parquet or Delta Lake", desc: "Long-term store of every event. Training data comes from here.",
      fields: [[null, "Retention (ticks)", "Not simulated", 20000]] },
    spark: { name: "Batch features", tool: "Spark", lane: "offline", real: "Apache Spark on a schedule (Airflow)", desc: "Recomputes offline features from the data lake on a schedule, and as the first stage of every retrain. Training reads these features; serving falls back to them when Redis has nothing for a user.",
      fields: [["spark_every", "Run every (ticks)", "0 = off. Every retrain also runs it first"], ["spark_throughput", "Throughput (events per tick)", "0 = instant. Otherwise a job takes events / throughput ticks, and grows with the data lake"], ["freshness_alert", "Freshness alert after (ticks)", "Incident when the last successful run is older than this"]] },
    ofs: { name: "Offline features", tool: "Feature store", lane: "offline", real: "Feast or Tecton offline store", desc: "Point-in-time snapshots, so training sees each feature as it was when the event happened.",
      fields: [[null, "Snapshots kept per user", "Not simulated", 3]] },
    train: { name: "Training", tool: "Two-tower", lane: "offline", real: "PyTorch jobs on a GPU cluster", desc: "Builds training data from shown slates (clicks are positives, unclicked shown movies are negatives) and trains the two-tower model in the background while serving continues.",
      fields: [["retrain_every", "Retrain every (ticks)", "0 = only when you start one. Each retrain costs 40 credits"], ["epochs", "Epochs", ""], ["negatives", "Negatives per positive", "Sampled from the shown slate"], ["deploy_delay", "Deploy after (ticks)", "The new model serves this many ticks after training starts; the clock waits if training is slower"], ["random_negatives", "Random negatives", "Extra random catalog movies per example as easy negatives (0 = off)"]],
      toggles: [["batched_training", "Batched training", "Train a batch of examples at a time (about 7x faster on CPU). Off: one example at a time, the original loop; same model up to rounding"],
        ["logq_correction", "Popularity correction (logQ)", "Correct in-batch negatives for how often each movie is a positive, so popular movies aren't pushed down"],
        ["graded_positives", "Graded positives", "Weight each click by what followed: watched fully and rated well counts more than a click that was not watched"],
        ["tower_history", "Recent history in the user tower", "The user tower also sees the last 5 watched movies (fresh towers at the next retrain)"],
        ["train_from_scratch", "Train from scratch", "New towers every retrain instead of continuing the previous ones"]] },
    registry: { name: "Model registry", tool: "Registry", lane: "offline", real: "MLflow Model Registry plus a deploy monitor", desc: "Keeps every model version in memory (towers and index) for roll back. Watches CTR after each deploy.",
      fields: [["alert_drop_pct", "Alert: CTR drop (%)", "Opens an incident when rolling CTR falls this much"], ["alert_ticks", "Alert: within (ticks)", "How long after a deploy the rule watches"], ["alert_window", "Alert: window (ticks)", "Rolling window compared with the pre-deploy CTR"], ["canary_share", "Canary share (%)", "0 = deploy to everyone at once. 50 = an A/B test"], ["canary_ticks", "Canary length (ticks)", "Then promote, unless the canary is worse with 95% confidence"], ["holdout_pct", "Gate: held-out events (%)", "Newest events kept out of training for the gate"], ["gate_tolerance_pct", "Gate: tolerance (%)", "Reject a model whose Recall@20 is this much below production's"]],
      toggles: [["eval_gate", "Offline evaluation gate", "Score Recall@20 of the new and the production model on held-out clicks before deploying"]] },
    users: { name: "Users", tool: "World", lane: "world", real: "Your actual customers: their tastes change, they get bored, new ones sign up", desc: "The simulated users. A static world never changes; a dynamic one drifts, tires of repeats, and grows. Start the server with --world dynamic for the preset, or change these live.",
      fields: [["taste_drift_every", "Taste drift every (ticks)", "0 = off. Each time, some users' taste moves towards one genre"], ["taste_drift_share_pct", "Users drifting (%)", ""], ["fatigue_pct", "Fatigue (%)", "Click probability lost per repeat impression of the same movie"], ["rewatch_pct", "Rewatch (%)", "Click probability kept for a movie the user already watched"], ["users_joining_per_100_ticks", "New users per 100 ticks", "Only while some users haven't joined yet (dynamic world)"]],
      toggles: [["onboarding", "Onboarding", "Ask each new user for 3 favourite genres before their first slate (answers are imperfect). Fixes cold start for the next visit"]] },
    chaos: { name: "Chaos", tool: "Fault injection", lane: "world", real: "Chaos engineering (game days, Chaos Monkey)", desc: "Hidden faults on a seeded schedule: you find them from symptoms (alerts, health tiles) and fix them. Or inject a known fault as a drill.",
      fields: [["chaos_every", "Random fault about every (ticks)", "0 = off. Which fault and when stay hidden until it ends"]] }
  };

  function nodeStatus(id, d) {
    const p = S.pipe, st = d.st;
    if (!p || !st) return ["info", "…"];
    switch (id) {
      case "kafka": return ["ok", `${fmt(p.kafka.events)} events · ${p.kafka.events_per_tick}/tick`];
      case "flink": return p.flink.lag > p.settings.lag_alert ? ["crit", `lag ${fmt(p.flink.lag)} events · ${p.flink.processed_last_tick} processed last tick`]
        : p.flink.lag > 0 ? ["warn", `lag ${fmt(p.flink.lag)} events`] : ["ok", `no lag · ${fmt(p.flink.users_with_features)} users`];
      case "redis": return p.redis_skew != null && p.redis_skew * 100 > p.settings.skew_alert_pct ? ["crit", `skew ${pct(p.redis_skew, 0)} vs offline`] : ["ok", `${fmt(p.redis.keys)} keys · skew ${pct(p.redis_skew, 0)}`];
      case "server": return p.server.fallback_share > 0 ? ["crit", `${pct(p.server.fallback_share, 0)} served by fallback`] : d.mismatch ? ["warn", `serving v${p.server.model_version}, index v${p.ann.index_version}`] : ["ok", `serving v${p.server.model_version} · top ${p.server.slate_size} of ${p.server.num_candidates}`];
      case "ann": return p.ann.self_test != null && p.ann.self_test < 0.8 ? ["crit", `self-test ${pct(p.ann.self_test, 0)} passing`] : d.mismatch ? ["crit", `embeddings v${p.ann.index_version}, model v${p.ann.model_version}`] : ["ok", `embeddings v${p.ann.index_version} · ${fmt(p.ann.items)} items`];
      case "lake": return ["ok", `${fmt(p.lake.events)} events`];
      case "spark": return p.spark.running ? ["warn", `running · done t ${fmt(p.spark.running.done_tick)}`] : p.spark.last_run_tick == null ? ["info", p.spark.every ? `first run at t ${fmt(p.spark.every)}` : "never run"] : ["ok", `last run t ${fmt(p.spark.last_run_tick)}`];
      case "ofs": return ["ok", `${fmt(p.ofs.users)} users · ${fmt(p.ofs.items)} items`];
      case "train": return p.train ? [p.train.done ? "ok" : "warn", p.train.stage === "features" ? `v${p.train.version} waiting for Spark features` : `v${p.train.version} ${p.train.done ? "trained, deploys" : "training, deploys"} t ${fmt(p.train.deploy_tick)}`] : ["ok", p.settings.retrain_every ? `every ${p.settings.retrain_every} ticks` : "idle"];
      case "registry": return ["ok", `${p.registry.versions} versions · v${p.registry.serving_version} live`];
      case "users": return ["ok", `${fmt(p.world.active_users)} active${p.world.waiting_users ? ` · ${fmt(p.world.waiting_users)} to join` : ""}${p.world.drifted_users ? ` · ${fmt(p.world.drifted_users)} drifts` : ""}`];
      case "chaos": return p.settings.chaos_every ? ["warn", `on · about every ${p.settings.chaos_every} ticks`] : ["info", "off"];
    }
  }

  function diagram(d) {
    const lane = (ids) => `<div class="lanerow">${ids.map((id, i) => {
      const n = NODES[id], [st, txt] = nodeStatus(id, d);
      return `${i ? `<span class="arrow">${icon("arrow", 16)}</span>` : ""}<button class="node" data-act="node" data-v="${id}" aria-pressed="${S.node === id}">
        <span class="nm"><span class="dot bg-${st}" aria-hidden="true"></span>${n.name}</span><span class="tool">${n.tool}</span><span class="st s-${st}">${esc(txt)}</span></button>`;
    }).join("")}</div>`;
    return `<div class="lane"><div class="label">Serving path · online, every request</div>${lane(["kafka", "flink", "redis", "server", "ann"])}</div>
      <div class="lane" style="margin-top:20px"><div class="label">Training path · offline</div>${lane(["lake", "spark", "ofs", "train", "registry"])}</div>
      <div class="lane" style="margin-top:20px"><div class="label">World and chaos · ${S.pipe ? S.pipe.world.kind : ""} world</div>${lane(["users", "chaos"])}</div>
      <p class="muted" style="margin-top:14px; font-size:12px">Statuses come from the running components. Kafka also writes every event into the data lake.</p>`;
  }

  function pipeline(d) {
    const n = NODES[S.node], [st, txt] = nodeStatus(S.node, d), cfg = S.pipe ? S.pipe.settings : {};
    const val = (k) => (k in S.draft ? S.draft[k] : k in S.pending ? S.pending[k] : cfg[k]);
    const pendingNote = (k) => k in S.pending ? ` <span class="s-accent" style="font-size:12px">· applies at the next tick${d.st && !d.st.playing ? " (press play)" : ""}</span>` : "";
    const live = n.fields.filter((f) => f[0]);
    const fields = n.fields.map(([k, lab, help, mockv]) => k
      ? `<div class="field"><div><label for="f-${k}">${lab}</label>${pendingNote(k)}${help ? `<small>${help}</small>` : ""}</div><input id="f-${k}" type="number" data-cfg="${k}" step="1" value="${val(k) == null ? "" : val(k)}"></div>`
      : `<div class="field notlive"><div><label for="f-m-${lab}">${lab}</label><small>${help}</small></div><input id="f-m-${lab}" type="number" value="${mockv}" disabled></div>`).join("");
    const toggles = (n.toggles || []).map(([k, lab, help]) => `<div class="field"><div><span id="l-${k}">${lab}</span>${pendingNote(k)}<small>${help}</small></div><button class="switch" role="switch" aria-checked="${!!val(k)}" aria-labelledby="l-${k}" data-act="toggle" data-v="${k}"></button></div>`).join("");
    const dirty = live.some(([k]) => k in S.draft && S.draft[k] !== cfg[k]);
    const apply = live.length ? `<button class="btn ${dirty ? "primary" : ""}" data-act="apply" style="margin-top:14px" ${dirty ? "" : "disabled"}>Apply at next tick</button>` : "";
    const actions = S.node === "spark" ? `<button class="btn" data-act="spark" style="margin-top:14px">Run feature job now (${d.st ? d.st.budget.spark_cost : 5} credits)</button>`
      : S.node === "train" ? `<button class="btn" data-act="retrain" style="margin-top:14px" ${d.st && d.st.training ? "disabled" : ""}>Start a training run (${d.st ? d.st.budget.retrain_cost : 40} credits)</button>`
      : S.node === "ann" ? `<button class="btn ${d.mismatch ? "primary" : ""}" data-act="repair" data-v="rebuild_index" style="margin-top:14px">Rebuild index with v${d.st ? d.st.model_version : ""} embeddings</button>`
      : S.node === "flink" ? `<button class="btn" data-act="repair" data-v="restart_flink" style="margin-top:14px">Restart Flink</button>`
      : S.node === "server" ? `<button class="btn" data-act="repair" data-v="restart_model_server" style="margin-top:14px">Restart model server</button>`
      : S.node === "chaos" && S.faults ? `<div style="margin-top:14px; width:100%"><div class="label">Drill: inject a known fault (100 ticks)</div><div class="row" style="gap:8px; margin-top:8px">${Object.entries(S.faults.kinds).map(([k, t]) => `<button class="btn" data-act="drill" data-v="${k}">${esc(t)}</button>`).join("")}</div></div>` : "";
    return `${toastHtml()}
      <div class="head"><div><h1>Pipeline</h1><p>Every component of the recommender. Select one to see its live status and change the settings that exist in the simulation. Greyed-out settings are not simulated yet.</p></div></div>
      <div class="row" style="align-items:flex-start">
        <section class="panel" style="flex: 999 1 520px" aria-label="Pipeline diagram"><div id="diagram">${diagram(d)}</div></section>
        <section class="panel" style="flex: 1 1 300px" aria-labelledby="node-h">
          <div class="label">${n.lane === "online" ? "Serving path" : n.lane === "world" ? "World and chaos" : "Training path"}</div>
          <h2 id="node-h" style="margin-top:2px">${n.name}</h2>
          <p class="pill s-${st}" style="margin-top:8px" id="node-status"><span class="dot bg-${st}"></span>${esc(txt)}</p>
          <p style="margin-top:12px">${n.desc}</p>
          <p class="muted" style="margin-top:8px; font-size:12px">In a real company: ${n.real}</p>
          <div style="margin-top:12px">${fields}${toggles}</div>
          <div class="row" style="gap:8px">${apply}${actions}</div>
        </section>
      </div>`;
  }

  function models(d) {
    const M = S.models, st = d.st;
    if (!M || !st) return `<p class="empty">Loading…</p>`;
    const tr = M.training, target = M.rollback_target;
    const pillFor = (s) => s === "Production" ? "s-ok" : s === "Training" || s === "Canary" ? "s-accent" : s === "Rejected" ? "s-warn" : "s-info";
    const rows = M.versions.map((v) => [
      v.version === 0 ? "bootstrap" : `run-${String(v.version).padStart(2, "0")}`, `v${v.version}`,
      v.version === 0 ? "–" : fmt(v.started_tick), v.deploys.length ? v.deploys.map(fmt).join(", ") : "–",
      fmt(v.training_examples), v.epochs == null ? "–" : `${v.epochs} / ${v.negatives}`,
      v.train_seconds == null ? "–" : v.train_seconds.toFixed(1) + " s", pct(v.online_ctr), v.stage,
      v.gate ? `${pct(v.gate.recall_at_20)} <span class="muted">vs v${v.gate.production_version} ${pct(v.gate.production_recall_at_20)}</span>` : '<span class="muted">pending</span>',
      !v.ranker_info ? "–" : v.ranker_info.model === "mlp"
        ? `MLP · ${fmt(v.ranker_info.training_rows)} rows · loss ${v.ranker_info.final_loss}`
        : `logistic · ${fmt(v.ranker_info.training_rows)} rows · genre ${v.ranker_info.weights.genre_match} · pop ${v.ranker_info.weights.log_popularity}`]);
    if (tr) rows.unshift([`run-${String(tr.version).padStart(2, "0")}`, `v${tr.version}`, fmt(tr.started_tick), `due t ${fmt(tr.deploy_tick)}`, fmt(tr.training_examples), `${tr.epochs} / ${tr.negatives}`, tr.stage === "features" ? "Spark" : tr.done ? "done" : "running", "–", "Training", "–", "–"]);
    return `${toastHtml()}
      <div class="head"><div><h1>Models</h1><p>Every model version stays in memory with its towers and ANN index. Retraining runs in the background while the current model keeps serving; the new one deploys a fixed number of ticks after training starts.</p></div></div>
      <div class="row">
        <section class="panel" style="flex:1 1 220px"><div class="label">Production</div><p class="mono" style="font-size:26px; margin-top:4px">v${st.model_version}</p>
          <p class="${d.mismatch ? "s-warn" : "muted"}" style="font-size:12px">${d.mismatch ? `ANN index still holds v${st.index_version} embeddings` : `index matches (v${st.index_version})`}</p>
          <div class="row" style="margin-top:12px; gap:8px">${target != null ? `<button class="btn primary" data-act="rollback">Roll back to v${target}</button>` : `<button class="btn" disabled>Roll back</button>`}<button class="btn" data-act="export" data-v="${st.model_version}">Export v${st.model_version}</button></div></section>
        <section class="panel" style="flex:1 1 220px"><div class="label">Training</div><p class="mono" style="font-size:26px; margin-top:4px">${tr ? "v" + tr.version : "–"}</p>
          <p class="muted" style="font-size:12px">${tr ? (tr.stage === "features" ? "Waiting for its Spark feature job" : `${tr.done ? "Trained, waiting" : "Training"} · deploys at tick ${fmt(tr.deploy_tick)}${st.waiting_for_training ? " · clock waiting" : ""}`) : "Idle"}</p>
          <div style="margin-top:12px"><button class="btn ${tr ? "" : "primary"}" data-act="retrain" ${tr ? "disabled" : ""}>Retrain now (${st.budget.retrain_cost} credits)</button></div></section>
        <section class="panel" style="flex:1 1 220px"><div class="label">Deploy policy</div><p style="margin-top:4px">Deploy ${S.pipe ? S.pipe.settings.deploy_delay : "N"} ticks after training starts</p>
          <p class="muted" style="font-size:12px; margin-top:4px">Index rebuild and schedules are set in Pipeline.</p>
          <div style="margin-top:12px"><button class="btn" data-act="gonode" data-v="train">Change in Pipeline</button></div></section>
      </div>
      ${M.canary ? canaryPanel(M.canary) : ""}
      ${insightPanel()}
      <section class="panel" aria-labelledby="runs-h"><div class="head"><h2 id="runs-h">Model versions</h2><span class="muted" style="font-size:12px">Online CTR: clicks / shown over the ticks this version served</span></div>
        <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Run</th><th>Model</th><th>Started (tick)</th><th>Deployed (tick)</th><th>Training examples</th><th>Epochs / negatives</th><th>Train time</th><th>Online CTR</th><th>Ranker</th><th>Held-out Recall@20</th><th>Stage</th></tr></thead>
        <tbody>${rows.map((r) => `<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td><td class="mono">${r[4]}</td><td class="mono">${r[5]}</td><td class="mono">${r[6]}</td><td class="mono">${r[7]}</td><td class="mono muted" style="font-size:12px">${r[10]}</td><td class="mono">${r[9]}</td><td><span class="pill ${pillFor(r[8])}">${r[8]}</span></td></tr>`).join("")}</tbody></table></div>
        <p class="muted" style="margin-top:12px; font-size:12px">Held-out Recall@20 is computed when the offline evaluation gate is on (Pipeline, Model registry): the newest events are held out of training and both models are scored on their clicks. It mostly measures exposure (see CLAUDE.md), and it scores each model with its own fresh index, so it cannot catch a stale-index deploy. Online CTR is the final word.</p>
      </section>`;
  }

  function insightPanel() {
    const r = S.insight;
    const bar = (label, v, note) => `<div class="field"><div style="flex:1"><span>${label}</span><small>${note}</small>
        <div class="budget" style="width:100%; margin-top:6px"><span style="width:${(v || 0) * 100 / 0.8}%"></span></div></div>
        <span class="mono" style="min-width:64px; text-align:right">${pct(v)}</span></div>`;
    const body = !r ? `<p class="muted" style="margin-top:8px">Measures, for recently active users, the click rate of what is served against the best possible from each stage.</p>`
      : `<div style="margin-top:8px">
          ${bar("Best possible (oracle)", r.oracle, "the 10 most relevant movies in the catalog")}
          ${bar("Best of all candidates", r.candidates, `what the ranker could pick from · retrieval loses ${(r.retrieval_loss * 100).toFixed(1)} pts`)}
          ${bar("Best of two-tower candidates", r.two_tower, `${pct(r.relevant_share.two_tower, 0)} of them relevant`)}
          ${r.has_extra_sources ? bar("Best of profile candidates", r.extra, `${pct(r.relevant_share.extra, 0)} of them relevant`) : ""}
          ${bar("Candidates ordered by the learned profile", r.profile, "no ground truth: the best the system could do with what it knows about each user")}
          ${bar("Served", r.served, `ranking loses ${(r.ranking_loss * 100).toFixed(1)} pts · ${pct(r.relevant_share.served, 0)} of the slate relevant`)}
          <p class="muted" style="font-size:12px; margin-top:8px">${r.users} users, measured at tick ${fmt(r.tick)}. Expected click rates under the user model.</p></div>`;
    return `<section class="panel" aria-labelledby="insight-h"><div class="head"><h2 id="insight-h">Where clicks are lost</h2>
        <span class="muted" style="font-size:12px">Simulation insight: uses the users' true tastes, which the system never sees</span></div>
      ${body}<div style="margin-top:10px"><button class="btn" data-act="insight">Measure now</button></div></section>`;
  }

  function canaryPanel(c) {
    const t = c.test, ctr = (x) => pct(x.ctr), signif = t && (t.low > 0 || t.high < 0);
    return `<section class="panel" style="border-color:var(--accent)" aria-labelledby="canary-h"><div class="head"><h2 id="canary-h">Canary: v${c.version} on ${c.share}% of users</h2><span class="muted" style="font-size:12px">ticks ${fmt(c.start_tick)}–${fmt(c.end_tick)} · users split by a stable hash of their id</span></div>
      <div class="tiles" style="margin-top:12px">
        <div class="tile"><span class="label">v${c.control.version} (control)</span><span class="big">${ctr(c.control)}</span><span class="sub">${fmt(c.control.shown)} slates · ${fmt(c.control.clicks)} clicks</span></div>
        <div class="tile"><span class="label">v${c.version} (canary)</span><span class="big">${ctr(c.treatment)}</span><span class="sub">${fmt(c.treatment.shown)} slates · ${fmt(c.treatment.clicks)} clicks</span></div>
        <div class="tile"><span class="label">Difference (95% CI)</span><span class="big ${signif ? (t.diff > 0 ? "s-ok" : "s-crit") : ""}">${t ? (t.diff >= 0 ? "+" : "") + (t.diff * 100).toFixed(1) + " pts" : "–"}</span><span class="sub">${t ? `${(t.low * 100).toFixed(1)} to ${(t.high * 100).toFixed(1)} pts · ${signif ? "significant" : "not significant yet"}` : "waiting for traffic"}</span></div>
      </div>
      <div class="row" style="gap:8px; margin-top:12px"><button class="btn primary" data-act="canary" data-v="promote">Promote v${c.version} now</button><span class="muted" style="font-size:12px; align-self:center">Auto: promote at t ${fmt(c.end_tick)} unless v${c.version} is significantly worse than v${c.control.version}</span><button class="btn" data-act="canary" data-v="abort">Abort canary</button></div></section>`;
  }

  function monitoring(d) {
    const st = d.st, ref = st ? st.reference : null;
    const fresh = S.pipe && S.pipe.spark.last_run_tick != null ? d.t - S.pipe.spark.last_run_tick : null;
    const freshLimit = S.pipe ? S.pipe.settings.freshness_alert : 400;
    const deployTxt = d.lastDeploy.tick > 0 ? `${pct(d.sinceDeploy)} since v${d.lastDeploy.version} deploy (t ${fmt(d.lastDeploy.tick)}) · ${pct(d.beforeDeploy)} before` : `random list ${pct(ref && ref.random_ctr)} · perfect ${pct(ref && ref.oracle_ctr)}`;
    return `${toastHtml()}
      <div class="head"><div><h1>Monitoring</h1><p>Live health of the recommender: business metric first, then the system underneath it.</p></div>
        <div class="seg" role="group" aria-label="Time range">${[300, 600, 1500, 5000].map((r) => `<button data-act="range" data-v="${r}" aria-pressed="${S.range === r}">${r} ticks</button>`).join("")}</div></div>
      <div class="tiles">
        <div class="tile"><span class="label">Online CTR (${S.window} ticks)</span><span class="big">${pct(d.ctr)}</span><span class="sub">${deployTxt}</span></div>
        <div class="tile"><span class="label">Active users</span><span class="big">${d.last ? d.last.active_users : "–"}<span class="muted" style="font-size:14px"> / tick</span></span><span class="sub">${st ? fmt(st.num_users) : "–"} users in the world</span></div>
        <div class="tile"><span class="label">Recommend latency</span><span class="big">${d.latP50 == null ? "–" : d.latP50.toFixed(1) + " ms"}</span><span class="sub">median of per-tick medians · p99 ${d.latP99 == null ? "–" : d.latP99.toFixed(1) + " ms"} · wall clock</span></div>
        <div class="tile"><span class="label">Feature freshness</span><span class="big ${fresh != null && fresh > freshLimit ? "s-crit" : ""}">${fresh == null ? "–" : fmt(fresh)}<span class="muted" style="font-size:14px"> ticks</span></span><span class="sub">${fresh == null ? "Spark job not run yet (Pipeline, Batch features)" : `since last successful Spark run · alert after ${fmt(freshLimit)}`}</span></div>
      </div>
      <section class="panel" aria-labelledby="ctr-h"><div class="head"><h2 id="ctr-h">Click-through rate</h2><span class="muted" style="font-size:12px">Share of shown ${S.pipe ? S.pipe.settings.slate_size : 10}-movie lists that got a click</span></div><div style="margin-top:20px">${ctrChart(d)}</div></section>
      <div class="row">
        <section class="panel" style="flex: 2 1 340px" aria-labelledby="lat-h"><h2 id="lat-h">Recommend latency (ms)</h2><div style="margin-top:12px">${latencyChart(d)}</div></section>
      </div>
      <section class="panel" aria-labelledby="health-h"><div class="head"><h2 id="health-h">System health</h2><span class="muted" style="font-size:12px">Checked every 25 ticks (lag and fallback every tick). Red: an alert has fired.</span></div>
        <div class="tiles" style="margin-top:12px">${healthTiles(d)}</div></section>
      <section class="panel" aria-labelledby="log-h"><h2 id="log-h">Event log</h2><div style="margin-top:8px">${logHtml(12)}</div></section>`;
  }

  function healthTiles(d) {
    const h = d.st ? d.st.health : {}, cfg = S.pipe ? S.pipe.settings : {};
    const tile = (label, value, sub, bad) => `<div class="tile"><span class="label">${label}</span><span class="big ${bad ? "s-crit" : ""}">${value}</span><span class="sub">${sub}</span></div>`;
    return [
      tile("Flink lag", fmt(h.flink_lag) + '<span class="muted" style="font-size:14px"> events</span>', `Kafka events not yet processed · alert at ${fmt(cfg.lag_alert)}`, h.flink_lag > cfg.lag_alert),
      tile("Fallback share", pct(h.fallback_share, 0), "requests served by the popularity fallback, last 10 ticks", h.fallback_share > 0.5),
      tile("Index self-test", pct(h.index_self_test, 0), "golden queries answered as when the index was built · alert below 80%", h.index_self_test != null && h.index_self_test < 0.8),
      tile("Feature skew", pct(h.feature_skew, 0), `online vs offline genre preferences · alert at ${cfg.skew_alert_pct}%`, h.feature_skew != null && h.feature_skew * 100 > cfg.skew_alert_pct),
      tile("Catalog coverage", pct(h.coverage, 1), "movies shown in the last 100 ticks", false),
      tile("Click-mix drift", h.drift_psi == null ? "–" : h.drift_psi.toFixed(2), h.drift_psi == null ? "needs 400 ticks after a deploy" : "PSI vs the first 200 ticks after the deploy · alert at 0.2", h.drift_psi != null && h.drift_psi > 0.2)
    ].join("");
  }

  function faultsHtml() {
    const F = S.faults;
    if (!F) return "";
    const rows = F.faults.map((f) => `<div class="logitem" style="grid-template-columns:74px 1fr"><span class="mono muted">t ${fmt(f.start)}</span><span>${esc(f.title)}${f.drill ? ' <span class="chip">drill</span>' : ""} · ${f.status === "active" ? '<span class="s-crit">active</span>' : `ended t ${fmt(f.ended_tick)} (${esc(f.ended_by)})`}</span></div>`).join("");
    return `<section class="panel" aria-labelledby="faults-h"><div class="head"><h2 id="faults-h">Faults</h2><span class="muted" style="font-size:12px">${F.hidden_active ? `<span class="s-warn">${F.hidden_active} hidden fault${F.hidden_active > 1 ? "s" : ""} active</span> · ` : ""}chaos faults are revealed when they end</span></div>
      <div style="margin-top:8px">${rows || '<p class="empty">No faults yet. Turn on chaos or run a drill on Pipeline, Chaos.</p>'}</div></section>`;
  }

  function incidents(d) {
    const list = S.incidents;
    const ruleTxt = S.pipe ? `Rule: rolling CTR over ${S.pipe.settings.alert_window} ticks drops more than ${S.pipe.settings.alert_drop_pct}% below the pre-deploy CTR within ${S.pipe.settings.alert_ticks} ticks of a deploy.` : "Rule: rolling CTR drops sharply soon after a deploy.";
    if (!list.length) return `${toastHtml()}<div class="head"><div><h1>Incidents</h1><p>Alerts from monitoring. Each one links to a runbook: the first steps the on-call engineer should take.</p></div></div>
      <p class="empty">No incidents. ${esc(ruleTxt)} Thresholds are on Pipeline, Model registry.</p>${faultsHtml()}`;
    const a = list.find((x) => x.id === S.alert) || list[0];
    const stc = (s) => s === "Resolved" ? "s-ok" : s === "Mitigated" ? "s-accent" : "s-crit";
    const st = d.st;
    const chart = ctrChart(d, { start: Math.max(0, a.deploy_tick - 200), end: Math.min(d.t, a.tick + 200) });
    return `${toastHtml()}
      <div class="head"><div><h1>Incidents</h1><p>Alerts from monitoring. Each one links to a runbook: the first steps the on-call engineer should take. <span class="muted">${esc(ruleTxt)}</span></p></div></div>
      <div class="row" style="align-items:flex-start">
        <section class="panel" style="flex: 1 1 300px; padding: 8px 0 0 8px" aria-label="Alert inbox"><div class="alertlist">
          ${list.map((x) => `<button class="alert" data-act="alert" data-v="${x.id}" aria-pressed="${x.id === a.id}"><span class="stripe bg-${x.severity === "SEV2" ? "crit" : "warn"}"></span>
            <span><span style="font-weight:600">${esc(x.title)}</span><span class="meta"><span class="mono">${x.id}</span><span>${x.severity}</span><span class="mono">t ${fmt(x.tick)}</span><span class="${stc(x.status)}">${x.status}</span></span></span></button>`).join("")}
        </div></section>
        <section class="panel" style="flex: 999 1 440px" aria-labelledby="inc-h">
          <div class="row" style="gap:8px; align-items:center"><span class="mono muted">${a.id}</span><span class="pill s-${a.severity === "SEV2" ? "crit" : "warn"}">${a.severity}</span><span class="pill ${stc(a.status)}">${a.status}</span></div>
          <h2 id="inc-h" style="margin-top:8px; font-size:18px">${esc(a.title)}</h2>
          <p style="margin-top:8px">${esc(a.description)}</p>
          <section style="margin-top:18px"><h3>Runbook</h3><ol class="runbook">${a.runbook.map((r) => `<li>${esc(r)}</li>`).join("")}</ol></section>
          <section style="margin-top:18px"><h3>Timeline</h3><div class="log" style="margin-top:4px">
            ${a.timeline.map((x) => `<div class="logitem" style="grid-template-columns:74px 1fr"><span class="mono muted">t ${fmt(x.tick)}</span><span>${esc(x.text)}</span></div>`).join("")}</div></section>
          <section style="margin-top:18px"><h3>${a.rule === "deploy_ctr" ? "CTR around the deploy" : "CTR around the alert"}</h3><div style="margin-top:16px">${chart}</div></section>
          ${a.status === "Open" && a.version != null && st && st.model_version === a.version && S.models && S.models.rollback_target != null ? `<div class="row" style="gap:8px; margin-top:18px"><button class="btn primary" data-act="rollback">Roll back to v${S.models.rollback_target}</button><button class="btn" data-act="gonode" data-v="ann">Inspect ANN index</button></div>` : ""}
        </section>
      </div>${faultsHtml()}`;
  }

  // ---------- render ----------
  const VIEWS = { missions, pipeline, models, monitoring, incidents };
  function render(full) {
    const d = derived();
    renderTop(d); renderNav(d);
    const focusInPanel = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.cfg;
    if (S.screen === "pipeline" && !full && focusInPanel) {
      // Don't rebuild the form while the player is typing in it.
      const dg = document.getElementById("diagram"); if (dg) dg.innerHTML = diagram(d);
      const ns = document.getElementById("node-status"); if (ns) { const [st, txt] = nodeStatus(S.node, d); ns.className = `pill s-${st}`; ns.innerHTML = `<span class="dot bg-${st}"></span>${esc(txt)}`; }
    } else {
      const y = window.scrollY;
      document.getElementById("main").innerHTML = VIEWS[S.screen](d);
      if (!full) window.scrollTo(0, y);
    }
  }

  function say(msg, err) { S.toast = msg; S.toastErr = !!err; S.toastAt = Date.now(); }
  async function call(path, body, ok, onError) {
    try { const r = await post(path, body); if (ok) say(typeof ok === "function" ? ok(r) : ok); }
    catch (e) { say(String(e.message || e), true); if (onError) onError(); }
    await poll(); render(true);
  }
  // A rejected settings change must not stay on screen as pending.
  const dropPending = (keys) => () => { for (const k of keys) delete S.pending[k]; };

  function act(name, v) {
    const st = S.st;
    switch (name) {
      case "go": S.screen = v; S.toast = null; try { history.replaceState(null, "", "#" + v); } catch (e) {} window.scrollTo(0, 0); break;
      case "gonode": S.screen = "pipeline"; S.node = v; S.toast = null; try { history.replaceState(null, "", "#pipeline"); } catch (e) {} break;
      case "play": return call(st && st.playing ? "/api/pause" : "/api/play");
      case "step": return call("/api/step", { ticks: 10 });
      case "speed": return call("/api/speed", { speed: +v });
      case "range": S.range = +v; break;
      case "node": S.node = v; break;     // unapplied edits are kept
      case "alert": S.alert = v; break;
      case "toggle": {
        const now = v in S.pending ? S.pending[v] : !!(S.pipe && S.pipe.settings[v]);
        S.pending[v] = !now;
        return call("/api/settings", { [v]: !now }, "Setting queued: applies at the next tick boundary." + (st && !st.playing ? " Press play (or step) to apply it." : ""), dropPending([v]));
      }
      case "apply": {
        const cfg = S.pipe ? S.pipe.settings : {}, body = {};
        for (const [k, x] of Object.entries(S.draft)) if (x !== cfg[k]) body[k] = x;
        S.draft = {};
        Object.assign(S.pending, body);
        return call("/api/settings", body, "Settings queued: they apply at the next tick boundary." + (st && !st.playing ? " Press play (or step) to apply them." : ""), dropPending(Object.keys(body)));
      }
      case "spark": return call("/api/spark", {}, "Spark feature job queued for the next tick boundary.");
      case "retrain": return call("/api/retrain", {}, (r) => `Retrain queued at tick ${fmt(r.applies_at_tick)}. Serving continues; the new model deploys ${S.pipe ? S.pipe.settings.deploy_delay : "N"} ticks after it starts.` + (st && !st.playing ? " Press play." : ""));
      case "insight": {
        say("Measuring…");
        render(true);
        return post("/api/insight").then((r) => { S.insight = r.insight; say("Measured."); render(true); })
          .catch((e) => { say(String(e.message || e), true); render(true); });
      }
      case "export": return call(`/api/models/${v}/export`, {}, `Export of v${v} queued: it is written under the run directory at the next tick.`);
      case "canary": return call("/api/canary/" + v, {}, v === "promote" ? "Promotion queued for the next tick." : "Abort queued for the next tick.");
      case "repair": return call("/api/repair/" + v, {}, "Repair queued: it applies at the next tick boundary.");
      case "drill": return call("/api/fault", { kind: v, duration: 100 }, "Drill queued: the fault starts at the next tick. Watch Monitoring and Incidents.");
      case "rollback": return call("/api/rollback", {}, "Rollback queued: it applies at the next tick boundary." + (st && !st.playing ? " Press play." : ""));
    }
    render(true);
  }

  document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b && !b.disabled) act(b.dataset.act, b.dataset.v); });
  document.addEventListener("input", (e) => {
    const k = e.target.dataset && e.target.dataset.cfg; if (!k) return;
    const n = parseInt(e.target.value, 10); if (!Number.isNaN(n)) S.draft[k] = n;
    const btn = document.querySelector('[data-act="apply"]'); if (btn) { btn.disabled = false; btn.classList.add("primary"); }
  });
  // Enter in a settings field applies the edits.
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.cfg) { e.preventDefault(); act("apply"); }
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (SCREENS.includes(h) && h !== S.screen) { S.screen = h; render(true); } });
  render(true);
  poll();
  setInterval(poll, 1000);
  setInterval(renderConn, 1000);
  // Browsers slow timers down in background tabs (Chrome: down to once a
  // minute); refresh at once when the tab is shown again.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
})();
</script>
</body></html>
